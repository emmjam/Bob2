# UNVALIDATED on actual TerraMaster TOS version. Read docs/design.md and docs/acceptance.md.
services:
  gluetun:
    restart: unless-stopped
    networks: &media_network
    - media
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: ${GLUETUN_IMAGE:?Set GLUETUN_IMAGE in a private .env}
    cap_add:
    - NET_ADMIN
    devices:
    - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ:?Set TZ in a private .env}
      VPN_SERVICE_PROVIDER: nordvpn
      VPN_TYPE: openvpn
      OPENVPN_USER: ${NORDVPN_SERVICE_USER:?Set NORDVPN_SERVICE_USER in a private .env}
      OPENVPN_PASSWORD: ${NORDVPN_SERVICE_PASSWORD:?Set NORDVPN_SERVICE_PASSWORD in a private .env}
      SERVER_COUNTRIES: ${NORDVPN_COUNTRIES:?Set NORDVPN_COUNTRIES in a private .env}
      FIREWALL: 'on'
      FIREWALL_INPUT_PORTS: '9091'
      DNS_UPSTREAM_IPV6: 'off'
    ports:
    - ${NAS_BIND_IP:?Set NAS_BIND_IP in a private .env}:9091:9091
    volumes:
    - type: bind
      source: ${CONFIG_ROOT:?Set CONFIG_ROOT in a private .env}/gluetun
      target: /gluetun
      bind:
        create_host_path: false
    sysctls:
      net.ipv6.conf.all.disable_ipv6: '1'
      net.ipv6.conf.default.disable_ipv6: '1'
  transmission:
    restart: unless-stopped
    logging: *logging
    image: ${TRANSMISSION_IMAGE:?Set TRANSMISSION_IMAGE in a private .env}
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      PUID: ${MEDIA_UID:?Set MEDIA_UID in a private .env}
      PGID: ${MEDIA_GID:?Set MEDIA_GID in a private .env}
      TZ: ${TZ:?Set TZ in a private .env}
      UMASK: '002'
      USER: ${TRANSMISSION_USER:?Set TRANSMISSION_USER in a private .env}
      PASS: ${TRANSMISSION_PASSWORD:?Set TRANSMISSION_PASSWORD in a private .env}
    volumes:
    - type: bind
      source: ${CONFIG_ROOT:?Set CONFIG_ROOT in a private .env}/transmission
      target: /config
      bind:
        create_host_path: false
    - type: bind
      source: ${DOWNLOAD_ROOT:?Set DOWNLOAD_ROOT in a private .env}
      target: /data/downloads
      bind:
        create_host_path: false
    - type: bind
      source: ${TRANSMISSION_RESOLV_FILE:?Set absolute private resolver file path}
      target: /etc/resolv.conf
      read_only: true
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD-SHELL
      - curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9091/transmission/rpc | grep -Eq '^(401|409)$'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  sonarr:
    restart: unless-stopped
    networks: *media_network
    logging: *logging
    image: ${SONARR_IMAGE:?Set SONARR_IMAGE in a private .env}
    environment:
      PUID: ${MEDIA_UID:?Set MEDIA_UID in a private .env}
      PGID: ${MEDIA_GID:?Set MEDIA_GID in a private .env}
      TZ: ${TZ:?Set TZ in a private .env}
      UMASK: '002'
    ports:
    - ${NAS_BIND_IP:?Set NAS_BIND_IP in a private .env}:${SONARR_PORT:?Set SONARR_PORT in a private .env}:8989
    volumes:
    - type: bind
      source: ${CONFIG_ROOT:?Set CONFIG_ROOT in a private .env}/sonarr
      target: /config
      bind:
        create_host_path: false
    - type: bind
      source: ${DOWNLOAD_ROOT:?Set DOWNLOAD_ROOT in a private .env}
      target: /data/downloads
      bind:
        create_host_path: false
    - type: bind
      source: ${TV_ROOT:?Set TV_ROOT in a private .env}
      target: /data/media/tv
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:8989/ping >/dev/null
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  radarr:
    restart: unless-stopped
    networks: *media_network
    logging: *logging
    image: ${RADARR_IMAGE:?Set RADARR_IMAGE in a private .env}
    environment:
      PUID: ${MEDIA_UID:?Set MEDIA_UID in a private .env}
      PGID: ${MEDIA_GID:?Set MEDIA_GID in a private .env}
      TZ: ${TZ:?Set TZ in a private .env}
      UMASK: '002'
    ports:
    - ${NAS_BIND_IP:?Set NAS_BIND_IP in a private .env}:${RADARR_PORT:?Set RADARR_PORT in a private .env}:7878
    volumes:
    - type: bind
      source: ${CONFIG_ROOT:?Set CONFIG_ROOT in a private .env}/radarr
      target: /config
      bind:
        create_host_path: false
    - type: bind
      source: ${DOWNLOAD_ROOT:?Set DOWNLOAD_ROOT in a private .env}
      target: /data/downloads
      bind:
        create_host_path: false
    - type: bind
      source: ${FILMS_ROOT:?Set FILMS_ROOT in a private .env}
      target: /data/media/movies
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:7878/ping >/dev/null
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  prowlarr:
    restart: unless-stopped
    networks: *media_network
    logging: *logging
    image: ${PROWLARR_IMAGE:?Set PROWLARR_IMAGE in a private .env}
    environment:
      PUID: ${MEDIA_UID:?Set MEDIA_UID in a private .env}
      PGID: ${MEDIA_GID:?Set MEDIA_GID in a private .env}
      TZ: ${TZ:?Set TZ in a private .env}
      UMASK: '002'
    ports:
    - ${NAS_BIND_IP:?Set NAS_BIND_IP in a private .env}:${PROWLARR_PORT:?Set PROWLARR_PORT in a private .env}:9696
    volumes:
    - type: bind
      source: ${CONFIG_ROOT:?Set CONFIG_ROOT in a private .env}/prowlarr
      target: /config
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:9696/ping >/dev/null
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  seerr:
    restart: unless-stopped
    networks: *media_network
    logging: *logging
    image: ${SEERR_IMAGE:?Set SEERR_IMAGE in a private .env}
    init: true
    user: ${SEERR_UID:?Set SEERR_UID in a private .env}:${SEERR_GID:?Set SEERR_GID in a private .env}
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    environment:
      TZ: ${TZ:?Set TZ in a private .env}
      DB_TYPE: sqlite
      LOG_LEVEL: info
    ports:
    - ${NAS_BIND_IP:?Set NAS_BIND_IP in a private .env}:${SEERR_PORT:?Set SEERR_PORT in a private .env}:5055
    volumes:
    - type: bind
      source: ${CONFIG_ROOT:?Set CONFIG_ROOT in a private .env}/seerr
      target: /app/config
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://127.0.0.1:5055/api/v1/settings/public || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  portal:
    image: nginx:alpine
    restart: unless-stopped
    networks: *media_network
    logging: *logging
    ports:
    - ${NAS_BIND_IP:?Set NAS_BIND_IP in a private .env}:${PORTAL_PORT:?Set PORTAL_PORT in a private .env}:80
    volumes:
    - type: bind
      source: ./portal
      target: /usr/share/nginx/html
      read_only: true
      bind:
        create_host_path: false
networks:
  media:
    driver: bridge
    enable_ipv6: false
